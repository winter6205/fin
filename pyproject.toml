[project]
name = "fin"
version = "0.1.0"
description = "A bounded 10-Q research agent: model-in-the-loop, code-verified citations."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = ["pytest>=8"]
