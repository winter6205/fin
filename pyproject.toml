[project]
name = "fin"
version = "0.1.0"
description = "A bounded 10-Q research agent: model-in-the-loop, code-verified citations."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3",
    "langchain-anthropic>=1.6.1",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]  # requires system tesseract binary

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "eval: opt-in eval cases (default `pytest -q` does NOT run these)",
    "soft_track: Soft-Track opt-in contracts (deselected by default)",
    "mcp: opt-in MCP 2.0 protocol smoke against a fixture server (deselected by default)",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fin-serve = "fin.host.http:serve"
