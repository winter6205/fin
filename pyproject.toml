[project]
name = "fin"
version = "0.1.0"
description = "A bounded 10-Q research agent: model-in-the-loop, code-verified citations."
requires-python = ">=3.12,<3.13"
readme = "README.md"
requires-dist = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = ["pytest>=8"]
