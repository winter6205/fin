[project]
name = "fin"
version = "0.1.0"
description = "A bounded 10-Q research agent: model-in-the-loop, code-verified citations."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-semantic-conventions==0.66b1",
    "pdfplumber>=0.11.10",
    "python-multipart>=0.0.9",
    "pyyaml==6.0.3",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30.0",
    "redis>=5",
]

[project.optional-dependencies]
object-store = ["boto3>=1.43.83"]  # required for CLI S3/MinIO client creation
ocr = ["pytesseract>=0.3.10"]  # system tesseract + traineddata eng and chi_sim

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "eval: opt-in eval cases (default `pytest -q` does NOT run these)",
    "soft_track: Soft-Track opt-in contracts (deselected by default)",
    "mcp: opt-in MCP 2.0 protocol smoke against a fixture server (deselected by default)",
    "sql_live: opt-in live business-ledger acceptance against the isolated dev PostgreSQL (deselected by default; a missing role or instance is a named failure, never a skip)",
    "runtime_pg: opt-in durable-runtime suites against an isolated PostgreSQL whose name ends in _test, selected through FIN_TEST_DSN (deselected by default; a missing DSN is a named failure, never a skip)",
    "memory_on: opt-in memory ON cases (default `pytest -q` deselects these; run with `-m memory_on`)",
    "jev_live: opt-in live Jev Choice round-trip (ADR 0080; deselected by default; a missing key is a named fail, never a skip)",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src/fin"]

[dependency-groups]
dev = ["pytest>=8", "pyright==1.1.414"]

[project.scripts]
fin-serve = "fin.host.http:serve"
