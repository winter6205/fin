# Dev-only Postgres. Production is compose/docker-compose.production.yml,
# installed under ~/.fin/compose/ and started with project name fin.
# This file must not publish host port 5433 or name fin_postgres_data.
name: fin-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: fin-dev-postgres
    environment:
      POSTGRES_DB: fin
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
    command: ["postgres", "-p", "5433"]
    ports:
      - "5435:5433"
    volumes:
      - fin_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d fin -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fin_dev_postgres_data:
    name: fin_dev_postgres_data
