# OS-layer pin for the G4 pipeline image (task C1).
#
# The `apt-get install` in the Dockerfile resolves from a live mirror, so an
# unpinned install floats the OS layer bytes on every build. Two things are
# recorded here: the exact package versions the build requests, and the exact
# versions the build actually installed.
#
# [mirror] is snapshot.debian.org rather than deb.debian.org. The base image
# python:3.12-slim@sha256:44ff437b... is Debian 13 "trixie" (NOT bookworm, which
# an earlier revision of PIN_MANIFEST.md claimed), and the base image's own
# /etc/apt/sources.list.d/debian.sources even carried a commented
# `# http://snapshot.debian.org/archive/debian/20260918T000000Z` line while
# still resolving against the floating URIs. This lock makes the mirror immutable.
#
# [installed] is the full dpkg status of the apt layer of the recorded image
# sha256:0f278c22..., read out of the layer tarball. It includes the transitive
# dependencies apt pulled, because those bytes are in the image too: a pin that
# names only the 8 requested packages leaves every dependency floating.
#
# The 8 requested versions were independently confirmed to resolve to exactly
# these versions in the trixie main/binary-amd64 Packages index at this
# snapshot, so requesting them pinned is consistent with what is recorded here.

