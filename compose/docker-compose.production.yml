# Production compose template — Postgres checkpoint store.
# An operator copies this file to ~/.fin/compose/.
# This change does not apply it: it does not start, stop, or recreate containers.
# The volume is external so compose never creates or deletes fin_postgres_data.
name: fin

services:
  postgres:
    image: postgres:16-alpine
    container_name: fin-postgres
    restart: unless-stopped
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_USER: fin
      POSTGRES_PASSWORD: fin
      POSTGRES_DB: fin
    ports:
      - "5433:5433"
    volumes:
      - fin_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin -d fin -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fin_postgres_data:
    external: true
    name: fin_postgres_data
